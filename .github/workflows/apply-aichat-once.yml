name: apply-composer-agent-prefix
# One-shot: add Code composer 'agent' prefix so typecheck can pass.
# Safe to re-run — no-ops if already applied.
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/apply-aichat-once.yml'
      - 'scripts/composer-agent-prefix-v0.1.138.patch'
jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply composer agent prefix patch
        run: |
          set -euo pipefail
          git config user.name "DrMeji"
          git config user.email "122752031+DrMeji@users.noreply.github.com"
          PATCH=scripts/composer-agent-prefix-v0.1.138.patch
          if [ -f "$PATCH" ] && git apply --check "$PATCH"; then
            git apply "$PATCH"
            git add src/views/ProjectWorkspace.tsx
            git commit -m "v0.1.138: add Code composer agent prefix so typecheck can index COMPOSER_MODE_PREFIX."
            git push
          else
            echo "Patch already applied or does not fit; skipping."
          fi
