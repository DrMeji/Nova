name: Release

# Windows build + GitHub Release for tags like v0.1.0
# Publishes to private DrMeji/Ark AND public DrMeji/ark-dist (in-app update feed).
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows-release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Windows installer + portable
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
          # Do not let electron-builder publish — GITHUB_TOKEN cannot write to ark-dist.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder --win --publish never

      - name: Create GitHub releases
        shell: pwsh
        env:
          # Set repo secret ARK_DIST_TOKEN (PAT with write to DrMeji/ark-dist + Ark) for public feed.
          GH_TOKEN: ${{ secrets.ARK_DIST_TOKEN }}
          FALLBACK_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if (-not $env:GH_TOKEN) { $env:GH_TOKEN = $env:FALLBACK_TOKEN }
          $tag = "${{ github.ref_name }}"
          $ver = $tag.TrimStart("v")
          $setup = "release/ARK-Setup.exe"
          $portable = "release/ARK-Portable.exe"
          if (-not (Test-Path $setup)) {
            $setupAlt = Get-ChildItem release -Filter "ARK-Setup*.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($setupAlt) { $setup = $setupAlt.FullName } else { throw "Missing ARK-Setup.exe" }
          }
          $files = @($setup)
          if (Test-Path $portable) { $files += $portable }
          $body = @"
          ## ARK $tag

          Windows desktop build.

          - **ARK-Setup.exe** — installer (recommended)
          - **ARK-Portable.exe** — portable (no install), when present

          After install, use **Settings → Updates → Check → Download** for newer builds in-app.

          External brain API: http://127.0.0.1:8787 (docs/ark-brain-api.md)
          "@

          function Ensure-Release($repo) {
            $exists = gh release view $tag --repo $repo 2>$null
            if ($LASTEXITCODE -eq 0) {
              gh release upload $tag @files --repo $repo --clobber
            } else {
              gh release create $tag @files --repo $repo --title "ARK $ver" --notes $body
            }
          }

          Ensure-Release "DrMeji/Ark"
          try {
            Ensure-Release "DrMeji/ark-dist"
          } catch {
            Write-Warning "ark-dist publish failed — set ARK_DIST_TOKEN secret with write access to DrMeji/ark-dist"
            throw
          }
