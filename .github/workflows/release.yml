name: Release

# Build on private Ark-Source; publish installer assets only to public DrMeji/Ark.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build renderer (Vite)
        run: npm run build

      - name: Build Windows installer
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          WIN_CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder --win --publish never

      - name: Publish installers to public DrMeji/Ark only
        shell: pwsh
        env:
          # Prefer a PAT that can write Releases on DrMeji/Ark (cross-repo).
          GH_TOKEN: ${{ secrets.ARK_PUBLIC_RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          $tag = if ("${{ github.ref_type }}" -eq "tag") { "${{ github.ref_name }}" } else { throw "Tag required" }
          pwsh scripts/publish-public-release.ps1 -Tag $tag
