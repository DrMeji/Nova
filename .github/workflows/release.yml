name: Release

# Windows build + GitHub Release for tags like v0.1.0
# Single public repo: DrMeji/Ark (source + installers + in-app update feed).
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows-release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Windows installer + portable
        env:
          # Optional Authenticode: set repo secrets CSC_LINK (base64 .pfx) + CSC_KEY_PASSWORD.
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          WIN_CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder --win --publish never

      - name: Create GitHub release on DrMeji/Ark
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "${{ github.ref_name }}"
          $ver = $tag.TrimStart("v")
          $setup = "release/ARK-Setup.exe"
          $portable = "release/ARK-Portable.exe"
          if (-not (Test-Path $setup)) {
            $setupAlt = Get-ChildItem release -Filter "ARK-Setup*.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($setupAlt) { $setup = $setupAlt.FullName } else { throw "Missing ARK-Setup.exe" }
          }
          $files = @($setup)
          if (Test-Path $portable) { $files += $portable }
          $yml = "release/latest.yml"
          $blockmap = "release/ARK-Setup.exe.blockmap"
          if (Test-Path $yml) { $files += $yml }
          if (Test-Path $blockmap) { $files += $blockmap }
          $body = @"
          ## ARK $tag

          Windows desktop build.

          - **ARK-Setup.exe** — installer (recommended)
          - **ARK-Portable.exe** — portable (no install), when present
          - **latest.yml** / blockmap — in-app differential updates when present

          After install, use **Settings → Updates → Check → Download** for newer builds in-app.

          External brain API: http://127.0.0.1:8787 (docs/ark-brain-api.md · docs/lindsay-migration.md)
          "@

          $exists = gh release view $tag --repo DrMeji/Ark 2>$null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag @files --repo DrMeji/Ark --clobber
          } else {
            gh release create $tag @files --repo DrMeji/Ark --title "ARK $ver" --notes $body
          }
