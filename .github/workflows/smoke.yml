name: Smoke checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm run typecheck

  smoke-scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: node scripts/test-gguf-chat.cjs
      - run: node scripts/smoke-catalog-ssot.cjs
      - run: node scripts/smoke-secrets-check.cjs
      - run: node scripts/smoke-thread-brain.cjs
      - run: npm run smoke:delete
      - run: npm run smoke:routes
      - run: npm run smoke:parked
      - run: npm run smoke:file-ops
      - run: npm run smoke:self-guard
      - run: npm run smoke:cloud-wiring
      - run: npm run smoke:followup
      - run: npm run smoke:voice-refuse
      - run: npm run smoke:social-demo
      - run: npm run smoke:failover-matrix
      - run: npm run smoke:app-twins
      - run: npm run smoke:interactive-depth
      - run: npm run smoke:midbuild-switch
      - run: npm run smoke:no-brain-nudge
      - run: npm run smoke:ready-gates
      - run: npm run smoke:create-quality
      - run: npm run smoke:classify-turn
      - run: npm run smoke:create-reply
      - run: npm run smoke:create-intent
      - run: npm run smoke:dispatch-contract
      - run: npm run smoke:dispatch-hosts
      - run: npm run smoke:edit-weak
      - run: npm run smoke:verify-ask
      - run: npm run smoke:brain-profile
      - run: npm run smoke:auth-heal
      - run: npm run smoke:preview-session
      - run: npm run smoke:bind-isolation
      - run: npm run smoke:stretch-owners
      - run: npm run smoke:public-harden
      - run: npm run smoke:react-import-heal
      - run: npm run smoke:version-lock
      - run: npm run smoke:create-identity
      - run: npm run smoke:fast-refresh-boundaries
      # Freebuff 0.1.328: wire the green local-only gates that catch create/chat regressions.
      - run: npm run smoke:chat-spine
      - run: npm run smoke:classify-turn
      - run: npm run smoke:chat-abort-boundaries
      - run: npm run smoke:create-job-abort
      - run: npm run smoke:create-job-hydrate
      - run: npm run smoke:thin-create-path
      - run: npm run smoke:app-jsx-harden
      - run: npm run smoke:syntax-gate-tipjar
      - run: npm run smoke:brand-assets-local
      - run: npm run smoke:brand-logo-wire
      - run: npm run smoke:live-ownership
      - run: npm run smoke:permanent-create
      - run: npm run smoke:bulk-chat-delete
      - run: npm run smoke:create-pass-spine
      - run: npm run smoke:design-spine
      - run: npm run smoke:storefront
      - run: npm run smoke:single-brain-create
      - run: npm run smoke:ui-polish-floor
      - run: npm run smoke:tool-craft-contract
      - run: npm run smoke:answer-contract
      - run: npm run smoke:create-evidence
      - run: npm run smoke:product-plan
      # Brain HTTP smoke only when a local brain is running (desktop app).
      - name: Brain API smoke (optional)
        env:
          NOVA_BRAIN_SMOKE_OPTIONAL: '1'
        run: node scripts/smoke-brain-check.cjs
