name: Smoke checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm run typecheck

  smoke-scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: node scripts/test-gguf-chat.cjs
      - run: node scripts/smoke-catalog-ssot.cjs
      - run: node scripts/smoke-secrets-check.cjs
      - run: node scripts/smoke-thread-brain.cjs
      # Brain HTTP smoke only when a local brain is running (desktop app).
      - name: Brain API smoke (optional)
        env:
          ARK_BRAIN_SMOKE_OPTIONAL: '1'
        run: node scripts/smoke-brain-check.cjs
