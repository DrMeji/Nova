<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ARK</title>
    <meta name="description" content="ARK — Build anything. Powered by everything." />
    <link rel="icon" type="image/png" href="/ark-icon.png" />
    <link rel="apple-touch-icon" href="/ark-icon.png" />
    <style>html,body{background:#000;margin:0;}</style>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
    <meta name="twitter:card" content="summary_large_image">
  </head>
  <script>
    (function () {
      try {
        var theme = localStorage.getItem('ark-theme');
        var root = document.documentElement;
        if (theme === 'light') {
          root.classList.add('light');
          root.classList.remove('dark');
        } else {
          root.classList.add('dark');
          root.classList.remove('light');
        }
      } catch (e) { /* ignore */ }
    })();
  </script>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
